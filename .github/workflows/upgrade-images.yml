name: Manual Image Upgrade

on:
  workflow_dispatch: # This allows the workflow to be run manually from the Actions tab

concurrency:
  group: upgrade-images
  cancel-in-progress: false

jobs:
  upgrade-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Needed to commit changes back to the repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Upgrade Script
        run: npm run upgrade-images

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/c/US/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Automated: Manually upgraded images to high-res"
            git pull --rebase origin main
            git push
          fi
