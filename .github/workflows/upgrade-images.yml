name: Manual Image Upgrade

on:
  workflow_dispatch: # This allows the workflow to be run manually from the Actions tab

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  upgrade-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit changes back to the repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Upgrade Script
        run: npm run upgrade-images

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git commit -m "Automated: Manually upgraded images to high-res" || echo "No changes to commit"
          git push
